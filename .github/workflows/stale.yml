name: stale
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 90
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          any-of-issue-labels: 'p:later'
          exempt-issue-labels: 'p:now,p:next,security,rolling,routine-ok,question,help wanted,good first issue'
          stale-issue-label: 'stale'
          stale-issue-message: >-
            No activity for 90 days. Still relevant? A comment keeps it open;
            without one it closes in 14 days and can be reopened any time.
          close-issue-message: >-
            Closed after 104 days without activity. Reopen if it comes back.
          operations-per-run: 100
